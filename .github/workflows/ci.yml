name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Debug APK 编译验证 Dart 与原生（Kotlin）代码；release 需要本机签名配置。
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  native-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Host policy mocks, not a replacement for Harmony SDK/device validation.
      - run: node app/tool/test_running_notification_ohos.mjs
      - run: node app/tool/test_ai_credentials_ohos.mjs
      - run: node app/tool/tests/training_reminders_native_test.mjs
      - run: node app/tool/tests/launcher_icons_ohos_test.mjs
      - run: python -m unittest discover -s app/tool/tests -p 'test_*.py'
